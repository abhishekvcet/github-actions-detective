<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Actions Log Extractor</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --error: #ef4444;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            line-height: 1.5;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p {
            color: var(--text-muted);
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 2rem;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            margin-bottom: 2rem;
        }

        .form-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .input-group {
            flex: 1;
            min-width: 200px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            width: 100%;
            margin-top: 1rem;
        }

        button:hover {
            background: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .loader {
            display: none;
            text-align: center;
            margin: 2rem 0;
            color: var(--primary);
        }

        .error-message {
            display: none;
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid rgba(239, 68, 68, 0.2);
            margin-bottom: 1.5rem;
        }

        .log-entry {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 1rem;
            overflow: hidden;
        }

        .log-header {
            background: rgba(255, 255, 255, 0.03);
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .log-title {
            font-weight: 600;
        }

        .badge {
            background: rgba(239, 68, 68, 0.2);
            color: var(--error);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .log-content {
            padding: 1rem;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.875rem;
            white-space: pre-wrap;
            overflow-x: auto;
            max-height: 500px;
            overflow-y: auto;
            color: #e2e8f0;
        }

        #results {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>GitHub Actions Logs</h1>
            <p>Extract and inspect failed workflow logs instantly</p>
        </header>

        <div class="card">
            <div class="error-message" id="errorMessage"></div>

            <form id="fetchForm">
                <div class="form-group" style="margin-bottom: 1rem;">
                    <div class="input-group" style="flex: 100%;">
                        <label for="repoSelect">Select Repository (Auto-fetched)</label>
                        <select id="repoSelect" style="width: 100%; padding: 0.75rem 1rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 1rem; outline: none; margin-bottom: 1rem;">
                            <option value="">Loading repositories...</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <div class="input-group">
                        <label for="owner">Repository Owner</label>
                        <input type="text" id="owner" placeholder="e.g., torvalds" required>
                    </div>
                    <div class="input-group">
                        <label for="repo">Repository Name</label>
                        <input type="text" id="repo" placeholder="e.g., linux" required>
                    </div>
                    <div class="input-group">
                        <label for="limit">Limit (Runs)</label>
                        <input type="number" id="limit" value="5" min="1" max="20" required>
                    </div>
                </div>
                <button type="submit" id="submitBtn">Fetch Failed Logs</button>
            </form>
        </div>

        <div class="loader" id="loader">
            <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
                <style>
                    .spinner_P7sC {
                        transform-origin: center;
                        animation: spinner_svv2 .75s infinite linear
                    }

                    @keyframes spinner_svv2 {
                        100% {
                            transform: rotate(360deg)
                        }
                    }
                </style>
                <path
                    d="M10.14,1.16a11,11,0,0,0-9,8.92A1.59,1.59,0,0,0,2.46,12,1.52,1.52,0,0,0,4.11,10.7a8,8,0,0,1,6.66-6.61A1.42,1.42,0,0,0,12,2.69h0A1.57,1.57,0,0,0,10.14,1.16Z"
                    class="spinner_P7sC" />
            </svg>
            Fetching logs...
        </div>

        <div id="results"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const repoSelect = document.getElementById('repoSelect');
            try {
                const response = await fetch('/repos');
                if (response.ok) {
                    const data = await response.json();
                    if (data.repos && data.repos.length > 0) {
                        repoSelect.innerHTML = '<option value="">-- Select a Repository --</option>';
                        data.repos.forEach(repo => {
                            const option = document.createElement('option');
                            option.value = JSON.stringify({ owner: repo.owner, name: repo.name });
                            option.textContent = repo.full_name;
                            repoSelect.appendChild(option);
                        });
                    } else {
                        repoSelect.innerHTML = '<option value="">No repositories found</option>';
                    }
                } else {
                    repoSelect.innerHTML = '<option value="">Failed to load repositories</option>';
                }
            } catch (err) {
                repoSelect.innerHTML = '<option value="">Error loading repositories</option>';
            }
        });

        document.getElementById('repoSelect').addEventListener('change', (e) => {
            if (!e.target.value) return;
            try {
                const repoInfo = JSON.parse(e.target.value);
                document.getElementById('owner').value = repoInfo.owner;
                document.getElementById('repo').value = repoInfo.name;
                
                // Automatically fetch logs when a repo is selected
                document.getElementById('fetchForm').dispatchEvent(new Event('submit'));
            } catch (err) {
                console.error("Error parsing selected repo", err);
            }
        });

        document.getElementById('fetchForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const owner = document.getElementById('owner').value;
            const repo = document.getElementById('repo').value;
            const limit = document.getElementById('limit').value;

            const btn = document.getElementById('submitBtn');
            const loader = document.getElementById('loader');
            const results = document.getElementById('results');
            const errorMsg = document.getElementById('errorMessage');

            btn.disabled = true;
            loader.style.display = 'block';
            results.innerHTML = '';
            errorMsg.style.display = 'none';

            try {
                const response = await fetch(`/logs/${owner}/${repo}/failed?limit=${limit}`);

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.detail || 'Failed to fetch logs');
                }

                const data = await response.json();

                if (data.message) {
                    results.innerHTML = `<div class="card"><p style="text-align: center;">${data.message}</p></div>`;
                } else if (data.extracted_logs && data.extracted_logs.length > 0) {
                    data.extracted_logs.forEach(log => {
                        const div = document.createElement('div');
                        div.className = 'log-entry';

                        // Escape HTML in logs to prevent XSS and formatting issues
                        const escapeHTML = str => str.replace(/[&<>'"]/g,
                            tag => ({
                                '&': '&amp;',
                                '<': '&lt;',
                                '>': '&gt;',
                                "'": '&#39;',
                                '"': '&quot;'
                            }[tag] || tag)
                        );

                        div.innerHTML = `
                            <div class="log-header">
                                <div class="log-title">${escapeHTML(log.run_name)} / ${escapeHTML(log.job_name)}</div>
                                <div class="badge">Failed</div>
                            </div>
                            <div class="log-content">${escapeHTML(log.logs || 'No log content available.')}</div>
                        `;
                        results.appendChild(div);
                    });
                } else {
                    results.innerHTML = `<div class="card"><p style="text-align: center;">No failed logs found.</p></div>`;
                }
            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.style.display = 'block';
            } finally {
                btn.disabled = false;
                loader.style.display = 'none';
            }
        });
    </script>
</body>

</html>
